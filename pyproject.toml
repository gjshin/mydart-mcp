[project]
name = "mydart-mcp"
version = "0.1.0"
description = "OpenDART(전자공시) 기업 공시·재무제표 조회 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
mydart-mcp = "mydart_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mydart_mcp"]
